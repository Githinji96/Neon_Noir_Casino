
name: E2E Tests (Playwright)

# Manually triggered from GitHub Actions
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to run tests against'
        required: true
        type: choice
        options:
          - dev
          - main
        default: dev

      spec:
        description: 'Spec file to run (leave blank to run all)'
        required: false
        type: string
        default: ''

      project:
        description: 'Playwright project (desktop | chromium-auth | live-tables | all)'
        required: false
        type: choice
        options:
          - all
          - desktop
          - chromium-auth
          - live-tables
        default: all

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      BROWSER_CHANNEL: ''
      BASE_URL: 'http://localhost:4173'
      CI: 'true'

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Display selected branch
        run: |
          echo "Running Playwright tests on branch: ${{ inputs.branch }}"
          git branch --show-current

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app for preview
        run: npm run build

      - name: Verify built app contains Supabase config
        run: |
          if grep -r "supabase.co" dist/ --include="*.js" -l | head -1 > /dev/null 2>&1; then
            echo "Supabase URL found in build output"
          else
            echo "WARNING: Supabase URL not found in build."
            echo "Check VITE_SUPABASE_URL secret."
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        env:
          SPEC: ${{ inputs.spec }}
          PROJECT: ${{ inputs.project }}
        run: |
          ARGS=()

          if [ -n "$SPEC" ]; then
            ARGS+=("$SPEC")
          fi

          if [ "$PROJECT" != "all" ]; then
            ARGS+=("--project=$PROJECT")
          fi

          npx playwright test "${ARGS[@]}"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ inputs.branch }}
          path: playwright-report/
          retention-days: 14
