name: E2E Tests (Playwright)

# Only runs when manually triggered from the GitHub Actions tab.
# Go to: Actions → E2E Tests (Playwright) → Run workflow
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file to run (leave blank to run all)'
        required: false
        default: ''
      project:
        description: 'Playwright project (desktop | chromium-auth | live-tables | all)'
        required: false
        default: 'all'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # App env — needed so Vite can build/serve the app
      VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Test credentials — used by e2e/fixtures/testUsers.ts and globalSetup
      TEST_USER_EMAIL:        ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD:     ${{ secrets.TEST_USER_PASSWORD }}
      # Force Playwright to use bundled Chromium (no Edge on GitHub runners)
      BROWSER_CHANNEL:        ''
      # Tell playwright.config.ts to use the preview server URL
      BASE_URL:               'http://localhost:4173'
      CI:                     'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app for preview
        run: npm run build

      - name: Verify built app contains Supabase config
        run: |
          # Check the built JS contains a real Supabase URL (not empty/placeholder)
          if grep -r "supabase.co" dist/ --include="*.js" -l | head -1 > /dev/null 2>&1; then
            echo "✅ Supabase URL found in build output"
          else
            echo "❌ WARNING: Supabase URL not found in build. Check VITE_SUPABASE_URL secret."
            echo "Build env VITE_SUPABASE_URL is set: ${{ secrets.VITE_SUPABASE_URL != '' }}"
          fi

      - name: Install Playwright browsers
        # Only installs Chromium — faster than installing all browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: |
          if [ -n "${{ github.event.inputs.spec }}" ]; then
            # Run a specific spec file
            ARGS="${{ github.event.inputs.spec }}"
          else
            ARGS=""
          fi

          if [ "${{ github.event.inputs.project }}" != "all" ] && [ -n "${{ github.event.inputs.project }}" ]; then
            # Run a specific project
            ARGS="$ARGS --project=${{ github.event.inputs.project }}"
          fi

          npx playwright test $ARGS
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()  # upload even on test failure so you can inspect results
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
