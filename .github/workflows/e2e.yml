
name: E2E Tests (Playwright)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to run tests against'
        required: true
        type: choice
        options:
          - dev
          - main
        default: dev

      suite:
        description: 'Select All Suites or an individual test suite'
        required: true
        type: choice
        options:
          - all
          - registration.spec.ts
          - footer-legal.spec.ts
          - home.spec.ts
          - jackpots.spec.ts
          - navigation.spec.ts
          - responsiveness.spec.ts
          - vip.spec.ts
          - accessibility.spec.ts
          - auth.spec.ts
          - deposit-withdraw.spec.ts
          - notifications.spec.ts
          - settings.spec.ts
          - slot-betting.spec.ts
          - slot.spec.ts
          - liveTables.spec.ts
        default: all

      project:
        description: 'Select Playwright project'
        required: true
        type: choice
        options:
          - all
          - desktop
          - chromium-auth
          - live-tables
        default: all

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      BROWSER_CHANNEL: ''
      BASE_URL: 'http://localhost:4173'
      CI: 'true'

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Display test configuration
        run: |
          echo "Branch: ${{ inputs.branch }}"
          echo "Suite: ${{ inputs.suite }}"
          echo "Project: ${{ inputs.project }}"
          git branch --show-current

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app for preview
        run: npm run build

      - name: Verify built app contains Supabase config
        run: |
          if grep -r "supabase.co" dist/ --include="*.js" -l | head -1 > /dev/null 2>&1; then
            echo "Supabase URL found in build output"
          else
            echo "WARNING: Supabase URL not found in build."
            echo "Check VITE_SUPABASE_URL secret."
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        env:
          SUITE: ${{ inputs.suite }}
          PROJECT: ${{ inputs.project }}
        run: |
          ARGS=()

          # Select all suites or one individual suite
          if [ "$SUITE" != "all" ]; then
            if ! find . -type f -name "$SUITE" \
              -not -path "./node_modules/*" \
              -not -path "./.git/*" | grep -q .; then
              echo "ERROR: $SUITE was not found."
              exit 1
            fi

            ARGS+=("$SUITE")
          fi

          # Select Playwright project
          if [ "$PROJECT" != "all" ]; then
            ARGS+=("--project=$PROJECT")
          fi

          echo "Running: npx playwright test ${ARGS[*]}"

          npx playwright test "${ARGS[@]}"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ inputs.branch }}-${{ inputs.suite }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
