<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Neon Noir Casino — Cyberpunk iGaming Experience" />

    <!--
      Content Security Policy
      - default-src 'self': only load resources from the same origin by default
      - script-src 'self' 'unsafe-inline' 'unsafe-eval': required for Vite dev HMR preamble
        (Vite injects inline module scripts for React Fast Refresh; 'unsafe-eval' is needed
        for source-map support in dev. In production, tighten this to 'self' only or use nonces.)
      - style-src 'self' 'unsafe-inline': Tailwind/framer-motion inject inline styles
      - img-src 'self' data: https://picsum.photos: game thumbnails
      - connect-src 'self' https://*.supabase.co wss://*.supabase.co: Supabase API + Realtime
      - font-src 'self' https://fonts.gstatic.com: Google Fonts
      - frame-ancestors 'none': cannot be embedded in iframes (clickjacking protection)
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https://picsum.photos https://fastly.picsum.photos https://*.picsum.photos blob:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.jamendo.com https://*.jamendo.com;
      font-src 'self' https://fonts.gstatic.com;
      media-src 'self' blob: https://*.jamendo.com;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <!-- Prevent MIME-type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Referrer policy — don't leak path on navigation -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Neon Noir Casino</title>
    <!-- Google Fonts: Orbitron (futuristic) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
